<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Page Not Found — Pinnacle Counseling Group</title>
  <meta name="description" content="The page you were looking for could not be found. Return to Pinnacle Counseling Group's homepage or contact us directly." />
  <meta name="robots" content="noindex, follow" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Inter:wght@300;400;500&display=swap" media="print" onload="this.media='all'; this.onload=null" />

  <link rel="icon" type="image/png" href="PC_Black%20PC%20Logo_Asset%204%20small.png?v=1" />
  <link rel="apple-touch-icon" href="PC_Black%20PC%20Logo_Asset%204.png?v=1" />

  <style>
    :root {
      --white:        #ffffff;
      --cream-warm:   #ddd5c3;
      --ink:          #2f3535;
      --ink-soft:     rgba(47, 53, 53, 0.90);
      --clay:         #a36345;
      --clay-deep:    #9a5a3d;
      --sage:         #4f6361;
      --serif: "Cormorant Garamond", Georgia, "Times New Roman", serif;
      --sans:  "Inter", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
      --ease: cubic-bezier(.2, .7, .2, 1);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: var(--cream-warm);
      color: var(--ink);
      font-family: var(--sans);
      font-weight: 300;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(2rem, 6vw, 5rem);
      text-align: center;
    }
    .notfound { max-width: 580px; }
    .notfound__num {
      font-family: var(--serif);
      font-style: italic;
      font-weight: 300;
      font-size: clamp(5rem, 12vw, 8rem);
      line-height: 1;
      color: var(--clay);
      margin-bottom: 1.4rem;
      letter-spacing: -.02em;
    }
    .notfound__eyebrow {
      display: block;
      font-family: var(--sans);
      font-weight: 400;
      font-size: .72rem;
      letter-spacing: .32em;
      text-transform: uppercase;
      color: var(--sage);
      margin-bottom: 1rem;
    }
    .notfound h1 {
      font-family: var(--serif);
      font-weight: 300;
      font-size: clamp(2rem, 4.5vw, 2.8rem);
      line-height: 1.1;
      letter-spacing: -.01em;
      margin: 0 0 1.4rem;
    }
    .notfound h1 em { color: var(--clay); font-style: italic; }
    .notfound p {
      font-family: var(--serif);
      font-weight: 400;
      font-size: 1.1rem;
      line-height: 1.55;
      color: var(--ink-soft);
      margin: 0 0 2.4rem;
    }
    .notfound__actions {
      display: inline-flex;
      align-items: center;
      gap: 1.2rem;
      flex-wrap: wrap;
      justify-content: center;
    }
    .notfound__btn {
      display: inline-flex;
      align-items: center;
      gap: .7rem;
      padding: 1.05rem 1.9rem;
      border: 1px solid var(--ink);
      border-radius: 999px;
      color: var(--ink);
      background: transparent;
      font-family: var(--sans);
      font-weight: 400;
      font-size: .72rem;
      letter-spacing: .26em;
      text-transform: uppercase;
      text-decoration: none;
      transition: background .5s var(--ease), color .5s var(--ease), padding .35s var(--ease);
    }
    .notfound__btn:hover { background: var(--ink); color: var(--cream-warm); padding-right: 2.2rem; }
    .notfound__btn--clay { background: var(--clay); border-color: var(--clay); color: #fff; }
    .notfound__btn--clay:hover { background: var(--clay-deep); border-color: var(--clay-deep); color: #fff; }
  </style>
  <!-- Google tag (gtag.js) — HIPAA-aware config -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-C5NPRRT63D"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-C5NPRRT63D', {
      'anonymize_ip': true,
      'allow_google_signals': false,
      'allow_ad_personalization_signals': false
    });
  </script>

  <script src="waitlist.js?v=1" defer></script>
</head>
<body>
  <main class="notfound">
    <div class="notfound__num" aria-hidden="true">404</div>
    <span class="notfound__eyebrow">Lost the thread</span>
    <h1>This page <em>cannot be found</em>.</h1>
    <p>The link may have moved, or the page no longer exists. We'd still love to hear from you — return to the homepage or get in touch directly.</p>
    <div class="notfound__actions">
      <a href="/" class="notfound__btn">Return Home</a>
      <a href="/contact.html" class="notfound__btn notfound__btn--clay">Contact Us</a>
    </div>
  </main>
</body>
</html>
