  <script>
    /* reveal-failsafe: guarantee content is visible even if IO / animation stalls */
    (function () {
      var force = function () {
        document.querySelectorAll('.reveal:not(.is-in):not(.is-visible)').forEach(function (el) {
          el.classList.add('is-in');
          el.classList.add('is-visible');
        });
      };
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', function () { setTimeout(force, 1200); });
      } else {
        setTimeout(force, 1200);
      }
    })();
  </script>
